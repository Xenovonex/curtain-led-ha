# Package: SurpLife curtain light control helpers
input_boolean:
  curtain_power:
    name: Power
    icon: mdi:power
  curtain_mic:
    # Sound-reactive / "DJ" mode (device built-in microphone).
    # The BLE command is not decoded yet, so this only sends something once you
    # paste the captured hex into input_text.curtain_mic_cmd_on / _off below.
    # See docs/PROTOCOL.md -> "Sound / microphone mode" for how to capture it.
    name: Mic (sound-reactive) mode
    icon: mdi:microphone

input_text:
  # Paste decoded hex payloads here (comma-separate multiple frames, no spaces).
  # Empty = nothing is sent, so an un-decoded control is a harmless no-op.
  curtain_mic_cmd_on:
    name: Mic mode ON payload (hex)
    max: 255
    icon: mdi:microphone-settings
  curtain_mic_cmd_off:
    name: Mic mode OFF payload (hex)
    max: 255
    icon: mdi:microphone-off
  curtain_raw:
    name: Raw command (hex)
    max: 255
    icon: mdi:console-line

input_number:
  curtain_hue:
    name: Hue (X)
    min: 0
    max: 255
    step: 1
    mode: slider
    icon: mdi:palette
  curtain_white:
    name: White brightness
    min: 0
    max: 127
    step: 1
    initial: 60
    mode: slider
    icon: mdi:white-balance-sunny
  curtain_bright:
    name: Color brightness
    min: 0
    max: 127
    step: 1
    initial: 127
    mode: slider
    icon: mdi:brightness-6
  curtain_anim_id:
    name: Animation number
    min: 0
    max: 40
    step: 1
    initial: 2
    mode: slider
    icon: mdi:movie-open
  curtain_anim_speed:
    name: Animation speed
    min: 0
    max: 100
    step: 1
    initial: 50
    mode: slider
    icon: mdi:speedometer
  curtain_anim_bright:
    name: Animation brightness
    min: 0
    max: 100
    step: 1
    initial: 100
    mode: slider
    icon: mdi:brightness-6
  curtain_heart_dir:
    name: Heart direction byte
    min: 0
    max: 5
    step: 1
    initial: 5
    mode: box
    icon: mdi:arrow-all
  curtain_heart_speed:
    name: Heart speed
    min: 0
    max: 100
    step: 1
    initial: 25
    mode: slider
    icon: mdi:heart-pulse
  curtain_heart_bright:
    name: Heart brightness
    min: 0
    max: 100
    step: 1
    initial: 90
    mode: slider
    icon: mdi:brightness-6

automation:
  - id: curtain_power_toggle
    alias: Curtain power toggle
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.curtain_power
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: >-
            {% if is_state('input_boolean.curtain_power','on') %}0a7123,0ae20b{{ '%02x' | format(states('input_number.curtain_hue')|float|int) }}{{ '%02x' | format(states('input_number.curtain_white')|float|int) }}{% else %}0a7124{% endif %}
  - id: curtain_color_main
    alias: Curtain color hue + brightness
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.curtain_hue
          - input_number.curtain_bright
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: "0ae20b{{ '%02x' | format(states('input_number.curtain_hue')|float|int) }}{{ '%02x' | format(128 + (states('input_number.curtain_bright')|float|int)) }}"
  - id: curtain_color_white
    alias: Curtain white brightness
    mode: restart
    trigger:
      - platform: state
        entity_id: input_number.curtain_white
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: "0ae20b{{ '%02x' | format(states('input_number.curtain_hue')|float|int) }}{{ '%02x' | format(states('input_number.curtain_white')|float|int) }}"
  - id: curtain_anim
    alias: Curtain animation (id + speed + brightness)
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.curtain_anim_id
          - input_number.curtain_anim_speed
          - input_number.curtain_anim_bright
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: "0ae00200{{ '%02x' | format(states('input_number.curtain_anim_id')|float|int) }}{{ '%02x' | format(states('input_number.curtain_anim_speed')|float|int) }}{{ '%02x' | format(states('input_number.curtain_anim_bright')|float|int) }}"
  - id: curtain_mic_toggle
    alias: Curtain mic / sound-reactive mode
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.curtain_mic
    # Only publishes if you have pasted a decoded payload into the matching
    # input_text; otherwise it does nothing (safe until the command is known).
    condition:
      - condition: template
        value_template: >-
          {% set p = states('input_text.curtain_mic_cmd_on') if is_state('input_boolean.curtain_mic','on') else states('input_text.curtain_mic_cmd_off') %}
          {{ p not in ['', 'unknown', 'unavailable'] }}
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: >-
            {{ states('input_text.curtain_mic_cmd_on') if is_state('input_boolean.curtain_mic','on') else states('input_text.curtain_mic_cmd_off') }}
  - id: curtain_raw_send
    alias: Curtain raw command passthrough
    mode: restart
    trigger:
      - platform: state
        entity_id: input_text.curtain_raw
    condition:
      - condition: template
        value_template: "{{ states('input_text.curtain_raw') not in ['', 'unknown', 'unavailable'] }}"
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: "{{ states('input_text.curtain_raw') }}"
  - id: curtain_hearts
    alias: Curtain hearts (dir + speed + brightness)
    mode: restart
    trigger:
      - platform: state
        entity_id:
          - input_number.curtain_heart_dir
          - input_number.curtain_heart_speed
          - input_number.curtain_heart_bright
    action:
      - service: mqtt.publish
        data:
          topic: curtain/raw
          payload: "0ae205020000000000000000001e{{ '%02x' | format(states('input_number.curtain_heart_speed')|float|int) }}{{ '%02x' | format(states('input_number.curtain_heart_bright')|float|int) }}{{ '%02x' | format(states('input_number.curtain_heart_dir')|float|int) }}"
